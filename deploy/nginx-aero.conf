# Настройка nginx для сайта клуба.
#
# ЗАМЕНИТЕ ДВЕ ВЕЩИ ПЕРЕД УСТАНОВКОЙ:
#   1. ДОМЕН_ИЛИ_IP  -> ваш домен (aero-vlg.ru) или IP сервера
#   2. пути в location /uploads/ — если данные лежат в другом месте
#
# Файл кладётся в /etc/nginx/sites-available/aero
# и включается ссылкой в /etc/nginx/sites-enabled/

upstream aero_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

# HTTP: пока нет сертификата — просто отдаём сайт.
# После установки certbot сам допишет сюда редирект на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН_ИЛИ_IP;

    # Загрузка фото: до 60 МБ на форму, как в app.py
    client_max_body_size 60m;

    # Сжатие текста — экономит трафик на мобильных
    gzip on;
    gzip_min_length 500;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Статика напрямую, без захода в Python
    location /static/ {
        alias /srv/aero/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Фотографии новостей и профилей
    location /uploads/ {
        alias /srv/aero/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — в приложение
    location / {
        proxy_pass http://aero_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Долгие запросы (загрузка фото) не должны рваться рано
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
